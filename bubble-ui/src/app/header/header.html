    <header class="header" [class.header-border]="header.config().showBorderBottom">
        <nav class="navbar p-0">
            @if(header.config().showBubbleLogo) {
                <button routerLink="" class="btn-home mx-2">
                    <span class="chewy-regular me-1">Bubble</span>
                    <span class="gochi-hand-regular ">shelf</span>
                </button>
            }
            @if(header.config().showLanguageSelector) {
                <div class="d-flex justify-content-end m-3">

                    <div class="dropdown">
                        <button class="btn dropdown-toggle language-dropdown" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                            @if(currentLang() === 'en') {
                                <span class="icon" aria-hidden="true">🇬🇧</span>
                            }
                            @if(currentLang() === 'fr') {
                                <span class="icon" aria-hidden="true">🇫🇷</span>
                            }
                        </button>

                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton">
                            <li>
                                <button type="button" class="dropdown-item" (click)="changeLanguage('en')">
                                    <span class="icon" aria-hidden="true">🇬🇧</span>
                                </button>
                            </li>
                            <li>
                                <button type="button" class="dropdown-item" (click)="changeLanguage('fr')">
                                    <span class="icon" aria-hidden="true">🇫🇷</span>
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>

            }
            @if(header.config().showRestartBtn) {
                <div class="d-flex justify-content-end m-3">
                    <button routerLink="/question" class="btn btn-restart rounded mt-3"><i class="bi bi-arrow-clockwise me-2 "></i>{{ 'header.restart' | translate }}</button>
                </div>
            }
            <div class="container-fluid">
            </div>
        </nav>
    </header>
