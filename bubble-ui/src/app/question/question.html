<main class="question-wrapper">
    <div class="question-box">

        @if(loading()) {
            <app-spinner></app-spinner>
        }

        @if (dataQuiz(); as quiz) {
            <div class="row">
                <div class="col-md-3">Question {{ quiz.question.order}} :</div> 
                <div class="col-md-9 text-nowrap">{{ quiz.question.label }}</div>
            </div>
            <form>
                @for (answer of quiz.question.answers; track answer) {
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="answer" id="{{ answer.id }}" [value]="answer.id">
                        <label class="form-check-label" for="{{ answer.id }}">
                            {{ answer.label }}
                        </label>
                    </div>
                }
            </form>
        }

    </div>
</main>
