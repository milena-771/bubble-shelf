<div class="d-flex justify-content-end m-3">
    <button type="button" class="btn btn-orange-home btn-restart-question rounded mt-3" (click)="restart()"><i class="bi bi-arrow-clockwise me-2 "></i>Restart</button>
</div>

<main class="question-wrapper">
    <div class="question-box">

        @if(loading()) {
            <app-spinner></app-spinner>
        }

        @if (dataQuiz(); as quiz) {
            <div class="row mb-2">
                <div class="col-md-4 chewy-question ">Question {{ quiz.question.order}} :</div> 
                <div class="col-md-8 text-nowrap label-quesion">{{ quiz.question.label }}</div>
            </div>
            @if (progressBar(); as progress) {
                <div class="progress mb-3 ms-5 me-4">
                    <div class="progress-bar" role="progressbar" style.width="{{ currentPercentage() }}%" aria-valuenow="{{ progress.currentQuestionNumber }}" aria-valuemin="0" aria-valuemax="progress.totalQuestionNumber"></div>
                </div>
            }
            @for (answer of quiz.question.answers; track answer.id) {
                <div class="form-check my-1">
                    <input class="form-check-input" type="radio" name="answer" id="{{ answer.id }}" [value]="answer.id" (change)="onAnswerSelected(answer.id)" [checked]="selectedAnswerId() === answer.id">
                    <label class="form-check-label" for="{{ answer.id }}">
                        {{ answer.label }}
                    </label>
                </div>
            }
            <div class="row">
                    <div class="d-flex justify-content-center">
                        @if (quiz.question.order > 1) {
                            <!-- previous question button -->
                            <button type="button" class="btn btn-green rounded my-3 me-2" (click)="previousQuestion()"><i class="bi bi-caret-left-fill"></i></button>
                        }
                        <!-- next question button -->
                        <button type="button" class="btn btn-green rounded my-3 ms-2" [disabled]="selectedAnswerId() === 0 || !quiz" (click)="nextQuestion()"><i class="bi bi-caret-right-fill"></i></button>
                    </div>
            </div>
        }

    </div>
</main>
